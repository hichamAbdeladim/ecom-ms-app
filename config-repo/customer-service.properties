#spring.datasource.url = jdbc:mysql://localhost:3306/customers-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/customers-db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
